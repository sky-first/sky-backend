apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sky-poc-backend-secrets
  namespace: staging
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: sky-poc-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: redis-url
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai-api-key
    - secretKey: SECRET_KEY # Flask/Starlette session key
      remoteRef:
        key: jwt-secret-key
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: jwt-secret-key
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: encryption-key
#  - secretKey: POSTGRES_PASSWORD # If needed individually
#    remoteRef:
#      key: postgres-password
