apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky-poc-backend
  namespace: staging
  labels:
    app: sky-poc-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sky-poc-backend
  template:
    metadata:
      labels:
        app: sky-poc-backend
    spec:
      serviceAccountName: default # Ensure Workload Identity is bound if needed later
      containers:
        - name: sky-poc-backend
          image: skyacrstagingj3minh.azurecr.io/sky-poc-backend:staging # Default placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: DATABASE_URL
              value: "${DATABASE_URL}" # Will be replaced by envsubst
            - name: REDIS_URL
              value: "${REDIS_URL}" # Will be replaced by envsubst
            - name: OPENAI_API_KEY
              value: "${OPENAI_API_KEY}" # Will be replaced by envsubst
            - name: ENVIRONMENT
              value: "staging"
          # Basic probes to ensure rolling updates work smoothly
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
