apiVersion: v1
kind: ServiceAccount
metadata:
  name: sky-poc-backend
  namespace: staging # change per environment (staging / production)
  labels:
    app: sky-poc-backend
  annotations:
    # IRSA: bind this ServiceAccount to the IAM role that grants the voice
    # pipeline Transcribe (STT) + Polly (TTS) — so the pod gets short-lived
    # credentials from the pod identity webhook, and we drop the temporary
    # 4-hour SSO creds entirely. Fill in the role ARN created from
    # iam-trust-policy.json + iam-voice-permissions.json (see README).
    eks.amazonaws.com/role-arn: arn:aws:iam::741375879811:role/SKY_BACKEND_VOICE_ROLE
---
# NOTE: the Deployment (and the migrate/seed Jobs) currently set
# `serviceAccountName: default`. Point them at this ServiceAccount instead:
#
#   spec:
#     template:
#       spec:
#         serviceAccountName: sky-poc-backend
#
# so the pod actually assumes the IRSA role.
