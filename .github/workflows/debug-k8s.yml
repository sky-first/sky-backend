name: Debug K8s (Staging)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  CLUSTER_NAME: sky-aks-staging
  RESOURCE_GROUP: sky-aks-staging-rg

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open AKS Firewall for Runner
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az aks update --resource-group $RESOURCE_GROUP --name $CLUSTER_NAME --api-server-authorized-ip-ranges $RUNNER_IP

      - uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Get Pods
        run: kubectl get pods -n staging -o wide

      - name: Describe Pods (Check Events)
        run: |
          POD_NAME=$(kubectl get pods -n staging -l app=sky-poc-backend -o jsonpath="{.items[0].metadata.name}")
          echo "Describing Pod: $POD_NAME"
          kubectl describe pod $POD_NAME -n staging

      - name: Get Logs
        if: always()
        run: |
          POD_NAME=$(kubectl get pods -n staging -l app=sky-poc-backend -o jsonpath="{.items[0].metadata.name}")
          echo "Fetching logs for: $POD_NAME"
          kubectl logs $POD_NAME -n staging --all-containers --previous || kubectl logs $POD_NAME -n staging --all-containers
