name: Deploy Backend to AKS (Staging)
on:
  push:
    branches:
      - staging
  workflow_dispatch:
concurrency:
  group: deploy-backend-staging
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
env:
  ACR_NAME: skyacrstagingj3minh
  IMAGE_NAME: sky-poc-backend
  CLUSTER_NAME: sky-aks-staging
  RESOURCE_GROUP: sky-aks-staging-rg
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and Push
        run: |
          az acr login --name $ACR_NAME
          docker build --cache-from $ACR_NAME.azurecr.io/$IMAGE_NAME:staging -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} -t $ACR_NAME.azurecr.io/$IMAGE_NAME:staging .
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:staging
      # 🔓 LIBERA O ACESSO AO AKS
      - name: Open AKS Firewall for Runner
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az aks update --resource-group $RESOURCE_GROUP --name $CLUSTER_NAME --api-server-authorized-ip-ranges $RUNNER_IP
      - uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
      - name: Deploy
        run: |
          # Create namespace if not exists
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          
          # Replace variables in manifest (image tag and secrets)
          # Using envsubst to replace $DATABASE_URL, $REDIS_URL, etc from environment variables
          export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          export REDIS_URL="${{ secrets.REDIS_URL }}"
          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          
          # First replace the image tag specific placeholder 
          sed -i "s|image: .*|image: $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}|g" k8s/deployment.yaml
          
          # Then use envsubst for the rest (SAFE way that only replaces variables defined in the shell)
          envsubst < k8s/deployment.yaml > k8s/deployment.yaml.tmp && mv k8s/deployment.yaml.tmp k8s/deployment.yaml
          
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify
        run: kubectl rollout status deployment/$IMAGE_NAME -n staging --timeout=60s
