name: CI Placeholder

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  sanity:
    name: Sanity / YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint YAML
        run: |
          python3 - <<'PY'
          import glob, yaml
          from pathlib import Path

          class IgnoreTagsLoader(yaml.SafeLoader):
              pass

          def any_tag(loader, tag_suffix, node):
              return loader.construct_object(node)

          IgnoreTagsLoader.add_multi_constructor('', any_tag)

          files = []
          for pattern in ['.github/**/*.yml', '.github/**/*.yaml']:
              for f in glob.glob(pattern, recursive=True):
                  # Skip workflow templates to avoid custom recursive tags
                  if Path(f).parts[:3] == ('.github', 'templates', 'backend'):
                      continue
                  files.append(f)

          for f in files:
              with open(f, 'r') as fh:
                  yaml.load(fh, Loader=IgnoreTagsLoader)
          PY

      - name: Hello
        run: echo "CI placeholder OK"

