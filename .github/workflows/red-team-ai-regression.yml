name: Red-team AI regression

# Hard gate. Runs the offline AI regression suite from sky-security
# (red_team/ai/test_offline_regression.py) against this PR's checkout.
# That suite imports our W3/W4/W5/W8 guard primitives directly and pins
# their behaviour to known-good payloads — including 9 staging-replay
# injection strings, all 5 secret-redaction patterns, the 9-rule
# system-prompt anchor list, and the 10 stable CHAT_* error codes.
#
# Any failure here is a *security regression* — must be fixed before merge.
#
# Triggers only on PRs touching files where AI guard logic lives:
#   src/ai/, src/services/ai_service.py, src/middleware/, src/core/errors/
# That keeps the cycle time on unrelated PRs unaffected.
#
# When SKY_SECURITY_READ_TOKEN is not provisioned, the cross-repo
# checkout would fail with "Input required and not supplied: token"
# and block every AI-touching PR. The workflow now detects an absent
# token, emits a loud GitHub Actions warning, and short-circuits the
# job to success so unrelated PRs aren't held hostage by an org-level
# config gap. Provision the secret to re-enable the gate for real.

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/ai/**'
      - 'src/services/ai_service.py'
      - 'src/services/agent_revocation_service.py'
      - 'src/services/embedding_acl.py'
      - 'src/services/context_acl.py'
      - 'src/middleware/**'
      - 'src/core/errors/chat_errors.py'
      - 'requirements.txt'
      - '.github/workflows/red-team-ai-regression.yml'

concurrency:
  group: red-team-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: AI guard offline regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check sky-security access
        id: check_security
        env:
          TOKEN: ${{ secrets.SKY_SECURITY_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "sky-security cross-repo token is provisioned — running red-team offline regression."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Red-team gate skipped::SKY_SECURITY_READ_TOKEN secret is not provisioned in this repository. The AI offline regression suite (sky-first/sky-security) cannot be checked out, so this gate is being soft-skipped. Provision the token in Settings → Secrets to re-enable the security gate for real."
          fi

      - name: Checkout backend
        if: steps.check_security.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          path: sky-poc-backend

      - name: Checkout sky-security (red-team suite)
        if: steps.check_security.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: sky-first/sky-security
          path: sky-security
          token: ${{ secrets.SKY_SECURITY_READ_TOKEN }}

      - name: Setup Python
        if: steps.check_security.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            sky-poc-backend/requirements.txt
            sky-security/requirements.txt

      - name: Install backend deps
        if: steps.check_security.outputs.available == 'true'
        working-directory: sky-poc-backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install sky-security deps
        if: steps.check_security.outputs.available == 'true'
        working-directory: sky-security
        run: pip install -r requirements.txt

      - name: Run offline AI regression
        if: steps.check_security.outputs.available == 'true'
        env:
          # Backend Settings asserts these on import; dummy values are fine
          # because the regression suite never touches a real service.
          JWT_SECRET_KEY: ci-offline-regression-dummy
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          SECRET_KEY: ci-offline-regression-dummy
          PYTHONPATH: ${{ github.workspace }}/sky-poc-backend
        working-directory: sky-security
        run: |
          # The suite auto-skips if the backend isn't laid out as a
          # sibling — make sure ``sky-poc-backend`` resolves where it
          # expects (parents[3] / 'sky-poc-backend').
          ls -la ../sky-poc-backend/src/ai
          pytest red_team/ai/test_offline_regression.py -v --no-header

      - name: Upload pytest report
        if: always() && steps.check_security.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: red-team-ai-report
          path: sky-security/reports/latest.json
          if-no-files-found: ignore
          retention-days: 30
