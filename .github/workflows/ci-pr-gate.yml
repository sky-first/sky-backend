name: CI PR Gate - Backend

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/ci-pr-gate.yml'

concurrency:
  group: ci-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install black flake8

      - name: Check Formatting (Black)
        continue-on-error: true  # Zero-Interference: Don't block for style drift
        run: black --check .

      - name: Lint (Flake8)
        continue-on-error: true  # Zero-Interference: Don't block for style drift
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static Analysis (Bandit)
        continue-on-error: true  # Zero-Interference: Block only if security regressions are critical
        run: |
          pip install bandit
          # Use baseline to acknowledge legacy issues and block only new regressions
          if [ -f bandit-baseline.json ]; then
            bandit -r src/ -ll -b bandit-baseline.json
          else
            bandit -r src/ -ll
          fi

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.84.0
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: Container Scan (Trivy - FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      # Zero-Interference: Providing Redis to stabilize AI tests without mocking code
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      # REDIS_HOST REMOVED from here to avoid conflict with constructor tests
      TESTING: "True"
      # Required by pydantic_settings validation in src/config/settings.py.
      # Tests never sign real tokens with this value — conftest.py injects
      # its own test keys where needed — but the Settings() constructor
      # still requires the field to be present to load.
      JWT_SECRET_KEY: "ci-test-only-never-used-for-real-tokens"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov pytest-timeout

      - name: Run Tests
        # Per-test timeout via pytest-timeout prevents a single hanging
        # async test from pinning the whole job. `--timeout-method=thread`
        # also works for asyncio coroutines (signal method fails inside
        # non-main threads). Job-level timeout is a second safety net in
        # case the test runner itself deadlocks before pytest-timeout fires.
        timeout-minutes: 15
        run: |
          pytest --cov=src --cov-report=xml --timeout=120 --timeout-method=thread -v

  docker-build-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Verification
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sky-poc-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
