name: CI PR Gate - Backend

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci-pr-gate.yml'

concurrency:
  group: ci-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install black flake8

      - name: Check Formatting (Black)
        run: black --check .

      - name: Lint (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static Analysis (Bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.84.0
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: Container Scan (Trivy - FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run Tests
        run: |
          pytest --cov=src --cov-report=xml

  docker-build-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Verification
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sky-poc-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
