name: Build and Push to ACR

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

env:
  IMAGE_NAME: sky-poc-backend

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Environment & ACR
        id: env-setup
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ACR_NAME=skyacrprodel5zpw" >> $GITHUB_ENV
            echo "Targeting PRODUCTION Environment"
          else
            echo "ACR_NAME=skyacrstagingj3minh" >> $GITHUB_ENV
            echo "Targeting STAGING Environment"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PRs should NOT authenticate to Azure/ACR via OIDC.
      # The federated identity in Entra is typically configured for branch refs (push),
      # and PR subjects ("repo:...:pull_request") will fail with AADSTS700213.
      - name: Azure Login (Federated Identity)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name != 'pull_request'
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # In PR events `{{branch}}` can be empty, which generates an invalid tag like ":-<sha>".
            # Keep SHA tags stable and always valid.
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on push-to-branch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # On PRs we build only (no registry auth), so we use GitHub Actions cache.
          # On push we can use registry cache for faster rebuilds across runners.
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}.azurecr.io/{1}:buildcache', env.ACR_NAME, env.IMAGE_NAME) || 'type=gha' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}.azurecr.io/{1}:buildcache,mode=max', env.ACR_NAME, env.IMAGE_NAME) || 'type=gha,mode=max' }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

      - name: Update Infra Repository (GitOps Write-Back)
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          INFRA_REPO: sky-first/sky-poc-infra
          BRANCH: staging
        run: |
          echo "🔄 Checking out Infra Repository..."
          git clone https://$GITOPS_PAT@github.com/$INFRA_REPO.git infra-repo
          cd infra-repo
          git checkout $BRANCH
          
          # Define target file based on environment
          TARGET_FILE="gitops/bootstrap/staging/backend.yaml"
          echo "📂 Updating $TARGET_FILE..."
          
          # Update rollout-trigger annotation with current timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Use sed to replace the existing timestamp or add it if missing
          # Looking for 'rollout-trigger: "..."'
          sed -i "s/rollout-trigger: \".*\"/rollout-trigger: \"$TIMESTAMP\"/g" $TARGET_FILE
          
          # Verify change
          git diff $TARGET_FILE
          
          # Commit and Push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add $TARGET_FILE
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit (timestamp might be identical, or updates too fast)."
          else
            git commit -m "GitOps: Update rollout-trigger for backend at $TIMESTAMP"
            git push origin $BRANCH
            echo "✅ GitOps Write-Back Complete. ArgoCD should detect changes shortly."
          fi


