name: Build and Push to ACR

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

concurrency:
  group: build-deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: sky-poc-backend

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Environment & ACR
        id: env-setup
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ACR_NAME=skyacrprodel5zpw" >> $GITHUB_ENV
            echo "Targeting PRODUCTION Environment"
          else
            echo "ACR_NAME=skyacrstagingj3minh" >> $GITHUB_ENV
            echo "Targeting STAGING Environment"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (Federated Identity)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name != 'pull_request'
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # CRUCIAL: Gera a tag "sha-xxxx" que o ArgoCD Image Updater monitora
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on push-to-branch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}.azurecr.io/{1}:buildcache', env.ACR_NAME, env.IMAGE_NAME) || 'type=gha' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}.azurecr.io/{1}:buildcache,mode=max', env.ACR_NAME, env.IMAGE_NAME) || 'type=gha,mode=max' }}
          build-args: |
             BUILDKIT_INLINE_CACHE=1

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}