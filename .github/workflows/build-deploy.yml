name: Build and Push to ACR

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

env:
  ACR_NAME: skyacrstaging
  IMAGE_NAME: sky-poc-backend

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PRs should NOT authenticate to Azure/ACR via OIDC.
      # The federated identity in Entra is typically configured for branch refs (push),
      # and PR subjects ("repo:...:pull_request") will fail with AADSTS700213.
      - name: Azure Login (Federated Identity)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name != 'pull_request'
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # In PR events `{{branch}}` can be empty, which generates an invalid tag like ":-<sha>".
            # Keep SHA tags stable and always valid.
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on push-to-branch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # On PRs we build only (no registry auth), so we use GitHub Actions cache.
          # On push we can use registry cache for faster rebuilds across runners.
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}.azurecr.io/{1}:buildcache', env.ACR_NAME, env.IMAGE_NAME) || 'type=gha' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}.azurecr.io/{1}:buildcache,mode=max', env.ACR_NAME, env.IMAGE_NAME) || 'type=gha,mode=max' }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

      - name: Trigger ArgoCD Sync (Optional)
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        run: |
          echo "Image pushed successfully to ACR"
          echo "ArgoCD will auto-detect and sync within 3 minutes"
          echo "Tags: ${{ steps.meta.outputs.tags }}"


